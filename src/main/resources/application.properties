spring.application.name=tabloide-api
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Evita que o corpo JSON enviado ao Ollama (incluindo a imagem em Base64) apareça nos logs.
logging.level.org.springframework.web.client.DefaultRestClient=INFO

# Strategy ativa: local-vision ou tesseract
tabloide.extractor=local-vision

# Ollama local
tabloide.ollama.base-url=http://localhost:11434
tabloide.ollama.model=qwen3-vl:4b-instruct
tabloide.ollama.context-length=8192
tabloide.ollama.header-max-tokens=512
tabloide.ollama.offers-max-tokens=1800

# Segmentação genérica: cabeçalho + regiões horizontais sobrepostas
tabloide.image.header-ratio=0.20
tabloide.image.header-scale=3
tabloide.image.body-tiles=2
tabloide.image.tile-overlap=0.12
