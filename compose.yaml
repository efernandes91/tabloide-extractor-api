name: tabloide-extractor-api

x-ollama-image: &ollama-image ollama/ollama:0.34.1

services:
  ollama:
    image: *ollama-image
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ollama-model-pull:
    image: *ollama-image
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          echo "Modelo $$OLLAMA_MODEL já está disponível."
        else
          echo "Baixando $$OLLAMA_MODEL..."
          ollama pull "$$OLLAMA_MODEL"
        fi
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TABLOIDE_EXTRACTOR: local-vision
      TABLOIDE_OLLAMA_BASE_URL: http://ollama:11434
      TABLOIDE_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b-instruct}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1g -Djava.awt.headless=true
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      ollama-model-pull:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-data:
